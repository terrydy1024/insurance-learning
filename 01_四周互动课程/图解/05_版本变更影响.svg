<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="734" viewBox="0 0 1430 734" role="img" aria-label="版本变更影响 · 新旧链路如何分开"><rect width="100%" height="100%" fill="#fff"/><polyline points="300,216 398,216" fill="none" stroke="#64748b" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="422,216 400.38,226.41 400.38,205.59" fill="#64748b"/><g><rect x="326" y="178" width="68" height="28" fill="#fff"/><text x="360" y="192" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="360" dy="0">引用 V1</tspan></text></g><polyline points="640,216 758,216" fill="none" stroke="#15803d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="782,216 760.38,226.41 760.38,205.59" fill="#15803d"/><g><rect x="664.5" y="178" width="91" height="28" fill="#fff"/><text x="710" y="192" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="710" dy="0">承保后留痕</tspan></text></g><polyline points="300,496 398,496" fill="none" stroke="#c2410c" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="422,496 400.38,506.41 400.38,485.59" fill="#c2410c"/><g><rect x="325" y="458" width="70" height="28" fill="#fff"/><text x="360" y="472" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="360" dy="0">发布 V2</tspan></text></g><polyline points="660,496 768,496" fill="none" stroke="#7c3aed" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="792,496 770.38,506.41 770.38,485.59" fill="#7c3aed"/><g><rect x="679.5" y="458" width="91" height="28" fill="#fff"/><text x="725" y="472" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="725" dy="0">生成新方案</tspan></text></g><polyline points="190,172 190,122 1245,122 1245,285" fill="none" stroke="#b45309" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1245,309 1234.59,287.38 1255.41,287.38" fill="#b45309"/><polyline points="190,540 190,592 1245,592 1245,417" fill="none" stroke="#b45309" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1245,393 1255.41,414.62 1234.59,414.62" fill="#b45309"/><g fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"><rect x="80" y="172" width="220" height="88" rx="10" ry="10"/></g><g fill="#f1f5f9" stroke="#64748b" stroke-width="2.2"><rect x="420" y="172" width="220" height="88" rx="10" ry="10"/></g><g fill="#edfbea" stroke="#15803d" stroke-width="2.2"><rect x="780" y="172" width="250" height="88" rx="10" ry="10"/></g><g fill="#fff3e8" stroke="#c2410c" stroke-width="2.2"><rect x="80" y="452" width="220" height="88" rx="10" ry="10"/></g><g fill="#fff3e8" stroke="#c2410c" stroke-width="2.2"><rect x="420" y="452" width="240" height="88" rx="10" ry="10"/></g><g fill="#f3edff" stroke="#7c3aed" stroke-width="2.2"><rect x="790" y="452" width="230" height="88" rx="10" ry="10"/></g><g fill="#fff8e1" stroke="#b45309" stroke-width="2.2"><rect x="1120" y="307" width="250" height="88" rx="10" ry="10"/></g><text x="190" y="204" fill="#2563eb" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="190" dy="0">V1 已发布资料</tspan><tspan x="190" dy="24">旧条款与旧规则</tspan></text><text x="530" y="204" fill="#64748b" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="530" dy="0">既有试算</tspan><tspan x="530" dy="24">回看 V1 参数</tspan></text><text x="905" y="204" fill="#15803d" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="905" dy="0">已承保保单</tspan><tspan x="905" dy="24">以承保时合同为依据</tspan></text><text x="190" y="484" fill="#c2410c" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="190" dy="0">V2 新发布资料</tspan><tspan x="190" dy="24">新条款或新规则</tspan></text><text x="540" y="484" fill="#c2410c" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="540" dy="0">新试算与计划书</tspan><tspan x="540" dy="24">引用 V2 参数</tspan></text><text x="905" y="484" fill="#7c3aed" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="905" dy="0">新投保申请</tspan><tspan x="905" dy="24">按 V2 规则校验</tspan></text><text x="1245" y="339" fill="#b45309" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1245" dy="0">版本管理</tspan><tspan x="1245" dy="24">生效日期 · 适用范围 · 回滚</tspan></text><text x="80" y="623.5" fill="#7c2d12" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="80" dy="0">关键原则：版本变更首先影响新试算、新计划书和新投保。已承保保单继续按承保时的合同及适用资料处理。</tspan></text><text x="80" y="663" fill="#475569" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="80" dy="0">验收时要分别抽查旧链路和新链路，确认历史数据可回看，新增方案引用正确版本。</tspan></text><text x="715" y="34" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="715" dy="0">版本变更影响 · 新旧链路如何分开</tspan></text></svg>