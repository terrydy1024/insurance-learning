<svg xmlns="http://www.w3.org/2000/svg" width="1835" height="704" viewBox="0 0 1835 704" role="img" aria-label="保单生命周期 · 从申请到理赔"><rect width="100%" height="100%" fill="#fff"/><polyline points="250,248 368,248" fill="none" stroke="#2563eb" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="392,248 370.38,258.41 370.38,237.59" fill="#2563eb"/><g><rect x="297" y="210" width="46" height="28" fill="#fff"/><text x="320" y="224" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="320" dy="0">提交</tspan></text></g><polyline points="580,248 738,248" fill="none" stroke="#7c3aed" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="762,248 740.38,258.41 740.38,237.59" fill="#7c3aed"/><g><rect x="632" y="210" width="76" height="28" fill="#fff"/><text x="670" y="224" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="670" dy="0">进入核保</tspan></text></g><polyline points="970,248 1138,248" fill="none" stroke="#0f766e" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1162,248 1140.38,258.41 1140.38,237.59" fill="#0f766e"/><g><rect x="1019.5" y="210" width="91" height="28" fill="#fff"/><text x="1065" y="224" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1065" dy="0">通过后缴费</tspan></text></g><polyline points="1350,248 1548,248" fill="none" stroke="#15803d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1572,248 1550.38,258.41 1550.38,237.59" fill="#15803d"/><g><rect x="1422" y="210" width="76" height="28" fill="#fff"/><text x="1460" y="224" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1460" dy="0">确认承保</tspan></text></g><polyline points="1670,289 1670,425" fill="none" stroke="#0f766e" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1670,449 1659.59,427.38 1680.41,427.38" fill="#0f766e"/><g><rect x="1680" y="354" width="91" height="28" fill="#fff"/><text x="1725.5" y="368" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1725.5" dy="0">保单生效后</tspan></text></g><polyline points="1565,488 1402,488" fill="none" stroke="#c2410c" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1378,488 1399.62,477.59 1399.62,498.41" fill="#c2410c"/><g><rect x="1434.5" y="450" width="76" height="28" fill="#fff"/><text x="1472.5" y="464" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1472.5" dy="0">发生事故</tspan></text></g><polyline points="1170,488 1002,488" fill="none" stroke="#c2410c" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="978,488 999.62,477.59 999.62,498.41" fill="#c2410c"/><g><rect x="1037" y="450" width="76" height="28" fill="#fff"/><text x="1075" y="464" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1075" dy="0">审核责任</tspan></text></g><g fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"><rect x="60" y="207" width="190" height="82" rx="10" ry="10"/></g><g fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"><rect x="390" y="207" width="190" height="82" rx="10" ry="10"/></g><g fill="#f3edff" stroke="#7c3aed" stroke-width="2.2"><rect x="760" y="207" width="210" height="82" rx="10" ry="10"/></g><g fill="#e8f8f5" stroke="#0f766e" stroke-width="2.2"><rect x="1160" y="207" width="190" height="82" rx="10" ry="10"/></g><g fill="#edfbea" stroke="#15803d" stroke-width="2.2"><rect x="1570" y="207" width="200" height="82" rx="10" ry="10"/></g><g fill="#e8f8f5" stroke="#0f766e" stroke-width="2.2"><rect x="1565" y="447" width="210" height="82" rx="10" ry="10"/></g><g fill="#fff3e8" stroke="#c2410c" stroke-width="2.2"><rect x="1170" y="447" width="210" height="82" rx="10" ry="10"/></g><g fill="#fff3e8" stroke="#c2410c" stroke-width="2.2"><rect x="770" y="447" width="210" height="82" rx="10" ry="10"/></g><text x="155" y="236" fill="#2563eb" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="155" dy="0">投保申请</tspan><tspan x="155" dy="24">填写信息与方案</tspan></text><text x="485" y="236" fill="#2563eb" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="485" dy="0">健康告知</tspan><tspan x="485" dy="24">提交风险信息</tspan></text><text x="865" y="236" fill="#7c3aed" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="865" dy="0">核保</tspan><tspan x="865" dy="24">判断是否承保及条件</tspan></text><text x="1255" y="236" fill="#0f766e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1255" dy="0">支付保费</tspan><tspan x="1255" dy="24">完成缴费</tspan></text><text x="1670" y="236" fill="#15803d" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1670" dy="0">承保出单</tspan><tspan x="1670" dy="24">形成保单合同</tspan></text><text x="1670" y="476" fill="#0f766e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1670" dy="0">保全服务</tspan><tspan x="1670" dy="24">变更、续期、查询</tspan></text><text x="1275" y="476" fill="#c2410c" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1275" dy="0">理赔申请</tspan><tspan x="1275" dy="24">提交事故材料</tspan></text><text x="875" y="476" fill="#c2410c" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="875" dy="0">理赔结案</tspan><tspan x="875" dy="24">审核并给付</tspan></text><text x="60" y="598" fill="#475569" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="60" dy="0">教学模型：不同产品和渠道的节点名称、顺序及系统归属会有差异。箭头表示保单状态或业务材料向下一环节传递。</tspan></text><text x="60" y="633" fill="#475569" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="60" dy="0">产品经理要逐步确认：页面收集了什么、规则在哪里判断、承保后哪些服务仍引用原合同。</tspan></text><text x="917.5" y="34" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="917.5" dy="0">保单生命周期 · 从申请到理赔</tspan></text></svg>