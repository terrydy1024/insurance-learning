<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="719" viewBox="0 0 2100 719" role="img" aria-label="产品资料到页面、试算与投保"><rect width="100%" height="100%" fill="#fff"/><polyline points="290,256 478,256" fill="none" stroke="#0f766e" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="502,256 480.38,266.41 480.38,245.59" fill="#0f766e"/><g><rect x="349.5" y="218" width="91" height="28" fill="#fff"/><text x="395" y="232" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="395" dy="0">采集与转换</tspan></text></g><polyline points="710,256 898,256" fill="none" stroke="#7c3aed" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="922,256 900.38,266.41 900.38,245.59" fill="#7c3aed"/><g><rect x="754.5" y="218" width="121" height="28" fill="#fff"/><text x="815" y="232" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="815" dy="0">写入可配置对象</tspan></text></g><polyline points="1160,256 1260,256 1260,186 1348,186" fill="none" stroke="#c2410c" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1372,186 1350.38,196.41 1350.38,175.59" fill="#c2410c"/><polyline points="1610,186 1798,186" fill="none" stroke="#15803d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1822,186 1800.38,196.41 1800.38,175.59" fill="#15803d"/><g><rect x="1662" y="148" width="106" height="28" fill="#fff"/><text x="1715" y="162" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1715" dy="0">同步展示口径</tspan></text></g><polyline points="1490,230 1490,370" fill="none" stroke="#15803d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1490,394 1479.59,372.38 1500.41,372.38" fill="#15803d"/><g><rect x="1500" y="297" width="106" height="28" fill="#fff"/><text x="1553" y="311" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1553" dy="0">承接方案参数</tspan></text></g><polyline points="1040,452 1040,322" fill="none" stroke="#7c3aed" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1040,298 1050.41,319.62 1029.59,319.62" fill="#7c3aed"/><g><rect x="1050" y="362" width="106" height="28" fill="#fff"/><text x="1103" y="376" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1103" dy="0">限定可用资料</tspan></text></g><g fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"><rect x="70" y="212" width="220" height="88" rx="10" ry="10"/></g><g fill="#e8f8f5" stroke="#0f766e" stroke-width="2.2"><rect x="500" y="212" width="210" height="88" rx="10" ry="10"/></g><g fill="#f3edff" stroke="#7c3aed" stroke-width="2.2"><rect x="920" y="212" width="240" height="88" rx="10" ry="10"/></g><g fill="#fff3e8" stroke="#c2410c" stroke-width="2.2"><rect x="1370" y="142" width="240" height="88" rx="10" ry="10"/></g><g fill="#edfbea" stroke="#15803d" stroke-width="2.2"><rect x="1820" y="142" width="220" height="88" rx="10" ry="10"/></g><g fill="#edfbea" stroke="#15803d" stroke-width="2.2"><rect x="1380" y="392" width="220" height="88" rx="10" ry="10"/></g><g fill="#fff8e1" stroke="#b45309" stroke-width="2.2"><rect x="920" y="452" width="240" height="88" rx="10" ry="10"/></g><text x="180" y="244" fill="#2563eb" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="180" dy="0">保司资料</tspan><tspan x="180" dy="24">条款 · 费率 · 规则</tspan></text><text x="605" y="244" fill="#0f766e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="605" dy="0">字段映射</tspan><tspan x="605" dy="24">统一编码与口径</tspan></text><text x="1040" y="244" fill="#7c3aed" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1040" dy="0">产品库</tspan><tspan x="1040" dy="24">产品、计划、责任、规则</tspan></text><text x="1490" y="174" fill="#c2410c" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1490" dy="0">试算与计划书</tspan><tspan x="1490" dy="24">报价、利益演示、输出</tspan></text><text x="1930" y="174" fill="#15803d" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1930" dy="0">销售页面</tspan><tspan x="1930" dy="24">展示责任与价格</tspan></text><text x="1490" y="424" fill="#15803d" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1490" dy="0">投保申请</tspan><tspan x="1490" dy="24">校验条件并提交</tspan></text><text x="1040" y="484" fill="#b45309" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1040" dy="0">版本上下文</tspan><tspan x="1040" dy="24">生效日期与资料版本</tspan></text><text x="70" y="613" fill="#475569" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="70" dy="0">教学模型：箭头表示数据或规则向下游传递。一次资料变更可能同时影响页面、试算、计划书与投保校验。</tspan></text><text x="70" y="648" fill="#475569" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="70" dy="0">联调时要用同一组输入样例比较四个消费者的结果，避免页面看起来正确却无法承接投保。</tspan></text><text x="1050" y="34" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="1050" dy="0">产品资料到页面、试算与投保</tspan></text></svg>