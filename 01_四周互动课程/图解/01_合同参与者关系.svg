<svg xmlns="http://www.w3.org/2000/svg" width="880" height="649" viewBox="0 0 880 649" role="img" aria-label="合同参与者关系 · 教学模型"><rect width="100%" height="100%" fill="#fff"/><polyline points="310,203 548,203" fill="none" stroke="#7c3aed" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="572,203 550.38,213.41 550.38,192.59" fill="#7c3aed"/><g><rect x="394.5" y="165" width="91" height="28" fill="#fff"/><text x="440" y="179" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="440" dy="0">投保与缴费</tspan></text></g><polyline points="195,244 195,350" fill="none" stroke="#0f766e" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="195,374 184.59,352.38 205.41,352.38" fill="#0f766e"/><g><rect x="205" y="294" width="106" height="28" fill="#fff"/><text x="258" y="308" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="258" dy="0">确定保障对象</tspan></text></g><polyline points="695,244 695,302 430,302 430,413 332,413" fill="none" stroke="#0f766e" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="308,413 329.62,402.59 329.62,423.41" fill="#0f766e"/><g><rect x="524.5" y="264" width="76" height="28" fill="#fff"/><text x="562.5" y="278" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="562.5" dy="0">提供保障</tspan></text></g><polyline points="695,244 695,350" fill="none" stroke="#c2410c" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="695,374 684.59,352.38 705.41,352.38" fill="#c2410c"/><g><rect x="705" y="294" width="91" height="28" fill="#fff"/><text x="750.5" y="308" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="750.5" dy="0">按合同给付</tspan></text></g><g fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"><rect x="80" y="162" width="230" height="82" rx="10" ry="10"/></g><g fill="#e8f8f5" stroke="#0f766e" stroke-width="2.2"><rect x="80" y="372" width="230" height="82" rx="10" ry="10"/></g><g fill="#f3edff" stroke="#7c3aed" stroke-width="2.2"><rect x="570" y="162" width="250" height="82" rx="10" ry="10"/></g><g fill="#fff3e8" stroke="#c2410c" stroke-width="2.2"><rect x="570" y="372" width="250" height="82" rx="10" ry="10"/></g><text x="195" y="190" fill="#2563eb" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="195" dy="0">投保人</tspan><tspan x="195" dy="26">提出投保并缴费</tspan></text><text x="195" y="400" fill="#0f766e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="195" dy="0">被保险人</tspan><tspan x="195" dy="26">承担被保障风险</tspan></text><text x="695" y="190" fill="#7c3aed" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="695" dy="0">保险公司</tspan><tspan x="695" dy="26">订立合同并承担责任</tspan></text><text x="695" y="400" fill="#c2410c" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="695" dy="0">受益人</tspan><tspan x="695" dy="26">按约定领取保险金</tspan></text><text x="80" y="543.5" fill="#475569" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="80" dy="0">图例：四方角色是保险合同的公开业务概念；箭头表示一方发起、承担或接收的业务动作。</tspan></text><text x="80" y="578" fill="#475569" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="80" dy="0">阅读定海柱8号时，先用这张图定位谁签约、谁被保障、谁可能领取。</tspan></text><text x="440" y="34" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="440" dy="0">合同参与者关系 · 教学模型</tspan></text></svg>