<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="714" viewBox="0 0 1850 714" role="img" aria-label="保险产品结构 · 从资料到可销售方案"><rect width="100%" height="100%" fill="#fff"/><polyline points="290,229 448,229" fill="none" stroke="#0f766e" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="472,229 450.38,239.41 450.38,218.59" fill="#0f766e"/><g><rect x="334.5" y="191" width="91" height="28" fill="#fff"/><text x="380" y="205" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="380" dy="0">整理与映射</tspan></text></g><polyline points="700,229 848,229" fill="none" stroke="#7c3aed" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="872,229 850.38,239.41 850.38,218.59" fill="#7c3aed"/><g><rect x="747" y="191" width="76" height="28" fill="#fff"/><text x="785" y="205" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="785" dy="0">归属产品</tspan></text></g><polyline points="1060,229 1198,229" fill="none" stroke="#7c3aed" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1222,229 1200.38,239.41 1200.38,218.59" fill="#7c3aed"/><g><rect x="1102" y="191" width="76" height="28" fill="#fff"/><text x="1140" y="205" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1140" dy="0">拆出计划</tspan></text></g><polyline points="1410,229 1548,229" fill="none" stroke="#c2410c" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1572,229 1550.38,239.41 1550.38,218.59" fill="#c2410c"/><g><rect x="1452" y="191" width="76" height="28" fill="#fff"/><text x="1490" y="205" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1490" dy="0">挂接责任</tspan></text></g><polyline points="1315,276 1315,362 1100,362 1100,410" fill="none" stroke="#b45309" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1100,434 1089.59,412.38 1110.41,412.38" fill="#b45309"/><g><rect x="1154.5" y="324" width="106" height="28" fill="#fff"/><text x="1207.5" y="338" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1207.5" dy="0">配置投保条件</tspan></text></g><polyline points="1680,276 1680,352 1600,352 1600,410" fill="none" stroke="#15803d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1600,434 1589.59,412.38 1610.41,412.38" fill="#15803d"/><g><rect x="1594.5" y="314" width="91" height="28" fill="#fff"/><text x="1640" y="328" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1640" dy="0">展示与承接</tspan></text></g><polyline points="1220,479 1458,479" fill="none" stroke="#15803d" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><polygon points="1482,479 1460.38,489.41 1460.38,468.59" fill="#15803d"/><g><rect x="1304.5" y="441" width="91" height="28" fill="#fff"/><text x="1350" y="455" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1350" dy="0">校验并报价</tspan></text></g><g fill="#eaf2ff" stroke="#2563eb" stroke-width="2.2"><rect x="70" y="182" width="220" height="94" rx="10" ry="10"/></g><g fill="#e8f8f5" stroke="#0f766e" stroke-width="2.2"><rect x="470" y="182" width="230" height="94" rx="10" ry="10"/></g><g fill="#f3edff" stroke="#7c3aed" stroke-width="2.2"><rect x="870" y="182" width="190" height="94" rx="10" ry="10"/></g><g fill="#f3edff" stroke="#7c3aed" stroke-width="2.2"><rect x="1220" y="182" width="190" height="94" rx="10" ry="10"/></g><g fill="#fff3e8" stroke="#c2410c" stroke-width="2.2"><rect x="1570" y="182" width="220" height="94" rx="10" ry="10"/></g><g fill="#fff8e1" stroke="#b45309" stroke-width="2.2"><rect x="980" y="432" width="240" height="94" rx="10" ry="10"/></g><g fill="#edfbea" stroke="#15803d" stroke-width="2.2"><rect x="1480" y="432" width="240" height="94" rx="10" ry="10"/></g><text x="180" y="205" fill="#2563eb" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="180" dy="0">保司资料</tspan><tspan x="180" dy="24">条款 · 费率 · 投保规则</tspan><tspan x="180" dy="24">公开资料</tspan></text><text x="585" y="205" fill="#0f766e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="585" dy="0">经纪平台产品数据</tspan><tspan x="585" dy="24">字段映射与展示口径</tspan><tspan x="585" dy="24">教学抽象</tspan></text><text x="965" y="217" fill="#7c3aed" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="965" dy="0">产品</tspan><tspan x="965" dy="24">整体合同与销售对象</tspan></text><text x="1315" y="217" fill="#7c3aed" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1315" dy="0">计划</tspan><tspan x="1315" dy="24">一组可投保组合</tspan></text><text x="1680" y="217" fill="#c2410c" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1680" dy="0">责任</tspan><tspan x="1680" dy="24">发生什么情形给什么保障</tspan></text><text x="1100" y="467" fill="#b45309" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1100" dy="0">规则与报价</tspan><tspan x="1100" dy="24">年龄 · 职业 · 保额 · 保费</tspan></text><text x="1600" y="467" fill="#15803d" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1600" dy="0">页面与投保</tspan><tspan x="1600" dy="24">试算 · 计划书 · 申请</tspan></text><text x="70" y="608" fill="#475569" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="70" dy="0">蓝色节点表示可以从公开条款或页面核对的资料；绿色和紫色节点是教学用的数据模型，实际后台字段需以平台定义为准。</tspan></text><text x="70" y="643" fill="#475569" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="start" dominant-baseline="middle"><tspan x="70" dy="0">学习方法：先回答页面展示了什么，再追问这项内容落在哪个对象、由哪条规则控制。</tspan></text><text x="925" y="34" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="925" dy="0">保险产品结构 · 从资料到可销售方案</tspan></text></svg>