<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1350" viewBox="0 0 720 1350" role="img" aria-label="产品资料到投保"><rect width="100%" height="100%" fill="#fff"/><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="56" y="122.5" width="280" height="91" rx="10" ry="10"/></g><g fill="#fff" stroke="#9a6700" stroke-width="2.2"><rect x="236" y="292" width="248" height="91" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="236" y="447" width="244" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#9a6700" stroke-width="2.2"><polygon points="352,605 468,681.5 352,758 236,681.5"/></g><g fill="#fff" stroke="#9a6700" stroke-width="2.2"><rect x="236" y="822" width="227" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="236" y="980" width="244" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="236" y="1138" width="227" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#9a6700" stroke-width="2.2"><ellipse cx="532" cy="168" rx="132" ry="60"/></g><text x="196" y="145" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="196" dy="0">页面可见：保司公开资料</tspan><tspan x="196" dy="23">条款、责任、投保规则、费率资料</tspan><tspan x="196" dy="23">定海柱8号可作为入门案例</tspan></text><text x="360" y="314.5" fill="#9a6700" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="360" dy="0">学习推演：平台产品数据</tspan><tspan x="360" dy="23">产品、方案、责任、限制条件</tspan><tspan x="360" dy="23">建立可供页面读取的字段</tspan></text><text x="358" y="470" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="358" dy="0">销售页面</tspan><tspan x="358" dy="24">展示方案、责任与投保入口</tspan><tspan x="358" dy="24">页面内容以公开资料为准</tspan></text><text x="352" y="635.5" fill="#9a6700" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="352" dy="0">规则校验</tspan><tspan x="352" dy="23">年龄、职业、保额</tspan><tspan x="352" dy="23">、缴费期</tspan><tspan x="352" dy="23">不满足条件时提示</tspan><tspan x="352" dy="23">调整</tspan></text><text x="349.5" y="845" fill="#9a6700" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="349.5" dy="0">试算与报价</tspan><tspan x="349.5" dy="24">按用户参数读取对应规则</tspan><tspan x="349.5" dy="24">输出保费与可选责任</tspan></text><text x="358" y="1003" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="358" dy="0">投保填写</tspan><tspan x="358" dy="24">采集身份、健康告知等信息</tspan><tspan x="358" dy="24">提交投保申请</tspan></text><text x="349.5" y="1161" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="349.5" dy="0">核保与承保</tspan><tspan x="349.5" dy="24">按实际系统完成风险判断</tspan><tspan x="349.5" dy="24">通过后生成保单</tspan></text><text x="532" y="133.5" fill="#9a6700" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="532" dy="0">学习边界</tspan><tspan x="532" dy="23">平台内部接口、数据库和</tspan><tspan x="532" dy="23">审批流</tspan><tspan x="532" dy="23">需要实际资料才能确认</tspan></text><text x="360" y="34" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="360" dy="0">产品资料到投保</tspan></text></svg>