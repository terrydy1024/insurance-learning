<svg xmlns="http://www.w3.org/2000/svg" width="1212" height="677" viewBox="0 0 1212 677" role="img" aria-label="四类险种保障对照"><rect width="100%" height="100%" fill="#fff"/><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="317.5" y="132.5" width="201" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#9a6700" stroke-width="2.2"><polygon points="606,315 736.5,358 606,401 475.5,358"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="56" y="465" width="176" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="296" y="465" width="244" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="604" y="465" width="227" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="895" y="465" width="261" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#9a6700" stroke-width="2.2"><ellipse cx="738.5" cy="179.5" rx="156" ry="71.5"/></g><text x="418" y="155.5" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="418" dy="0">页面可见：定海柱8号</tspan><tspan x="418" dy="24">定期寿险案例</tspan><tspan x="418" dy="24">用来认识身故保障</tspan></text><text x="606" y="346" fill="#9a6700" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="606" dy="0">先问：家庭要转移</tspan><tspan x="606" dy="24">哪类风险？</tspan></text><text x="144" y="488" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="144" dy="0">定期寿险</tspan><tspan x="144" dy="24">身故或全残风险</tspan><tspan x="144" dy="24">通常给付约定保额</tspan></text><text x="418" y="488" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="418" dy="0">重大疾病险</tspan><tspan x="418" dy="24">达到合同约定疾病状态</tspan><tspan x="418" dy="24">通常给付一次或多次保险金</tspan></text><text x="717.5" y="488" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="717.5" dy="0">医疗险</tspan><tspan x="717.5" dy="24">发生符合条件的医疗费用</tspan><tspan x="717.5" dy="24">按约定范围报销或给付</tspan></text><text x="1025.5" y="488" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="1025.5" dy="0">意外险</tspan><tspan x="1025.5" dy="24">外来的、突发的、非本意事故</tspan><tspan x="1025.5" dy="24">触发身故、伤残或医疗责任</tspan></text><text x="738.5" y="133.5" fill="#9a6700" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="738.5" dy="0">学习推演：同一家庭可能组合多</tspan><tspan x="738.5" dy="23">种险种</tspan><tspan x="738.5" dy="23">最终责任、等待期、免赔额与给</tspan><tspan x="738.5" dy="23">付方式</tspan><tspan x="738.5" dy="23">以对应产品条款为准</tspan></text><text x="606" y="34" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="606" dy="0">四类险种保障对照</tspan></text></svg>