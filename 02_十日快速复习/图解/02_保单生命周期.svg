<svg xmlns="http://www.w3.org/2000/svg" width="672" height="1376" viewBox="0 0 672 1376" role="img" aria-label="保单生命周期"><rect width="100%" height="100%" fill="#fff"/><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="56" y="315" width="159" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="56" y="473" width="210" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><polygon points="336,631 436,707.5 336,784 236,707.5"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="236" y="848" width="193" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="236" y="1006" width="227" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><rect x="236" y="1164" width="210" height="94" rx="10" ry="10"/></g><g fill="#fff" stroke="#2f6f9f" stroke-width="2.2"><ellipse cx="172" cy="179.5" rx="116" ry="71.5"/></g><g fill="#fff" stroke="#9a6700" stroke-width="2.2"><ellipse cx="484" cy="179.5" rx="132" ry="71.5"/></g><text x="135.5" y="338" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="135.5" dy="0">需求与投保</tspan><tspan x="135.5" dy="24">选择产品与方案</tspan><tspan x="135.5" dy="24">填写投保信息</tspan></text><text x="161" y="496" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="161" dy="0">如实告知</tspan><tspan x="161" dy="24">回答健康、职业等问题</tspan><tspan x="161" dy="24">提交必要资料</tspan></text><text x="336" y="661.5" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="336" dy="0">核保</tspan><tspan x="336" dy="23">按产品规则评估</tspan><tspan x="336" dy="23">风险</tspan><tspan x="336" dy="23">可能正常、加费</tspan><tspan x="336" dy="23">或拒保</tspan></text><text x="332.5" y="871" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="332.5" dy="0">缴费与承保</tspan><tspan x="332.5" dy="24">完成缴费后生成保单</tspan><tspan x="332.5" dy="24">进入保障期间</tspan></text><text x="349.5" y="1029" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="349.5" dy="0">服务与保全</tspan><tspan x="349.5" dy="24">信息变更、续期、退保等</tspan><tspan x="349.5" dy="24">按合同和流程办理</tspan></text><text x="341" y="1187" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="341" dy="0">理赔或终止</tspan><tspan x="341" dy="24">发生约定事故申请给付</tspan><tspan x="341" dy="24">期满、身故或退保结束</tspan></text><text x="172" y="133.5" fill="#2f6f9f" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="172" dy="0">页面可见：定海柱8号</tspan><tspan x="172" dy="23">产品页提供方案与投保</tspan><tspan x="172" dy="23">入口</tspan><tspan x="172" dy="23">正式条款决定合同权利</tspan><tspan x="172" dy="23">义务</tspan></text><text x="484" y="133.5" fill="#9a6700" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="484" dy="0">学习推演：具体审核与状</tspan><tspan x="484" dy="23">态流转</tspan><tspan x="484" dy="23">以实际条款和系统流程为</tspan><tspan x="484" dy="23">准</tspan><tspan x="484" dy="23">课程用于建立业务框架</tspan></text><text x="336" y="34" fill="#1e1e1e" font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="336" dy="0">保单生命周期</tspan></text></svg>